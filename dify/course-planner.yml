    - data:
        code: |
          import json


          def main(report_body: str) -> dict:
              """Turn the validator's report into something a prompt can carry."""
              try:
                  report = json.loads(report_body or "{}")
              except Exception as exc:
                  return {"verdict": "unreadable",
                          "errors_text": f"The validator's reply could not be "
                                         f"read: {exc}"}

              errors = report.get("errors") or []
              if not errors:
                  return {"verdict": "clean",
                          "errors_text": "No blocking errors. Leave the plan "
                                         "exactly as it is."}

              lines = []
              for issue in errors:
                  where = " · ".join(
                      str(x) for x in (issue.get("term"), issue.get("course")) if x)
                  lines.append(f"- [{issue.get('check')}] {issue.get('message')}"
                               + (f" ({where})" if where else ""))
              return {"verdict": "has_errors", "errors_text": "\n".join(lines)}
        code_language: python3
        desc: Reads the verdict and lists the blocking errors in plain English.
        outputs:
          errors_text:
            children: null
            type: string
          verdict:
            children: null
            type: string
        selected: false
        title: Read the verdict
        type: code
        variables:
        - value_selector:
          - '1706'
          - body
          variable: report_body
