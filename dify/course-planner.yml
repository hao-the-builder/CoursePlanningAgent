    - data:
        code: |
          import json


          def main(plan_json: str, rationale: str, report_body: str,
                   program_body: str) -> dict:
              """One JSON document out, carrying its own verdict.

              The validator's report travels with the plan. A caller that reads
              `ok` is reading the validator, not the model's opinion of itself,
              and `errors` is non-empty whenever the plan is not clean — so a
              plan that failed can never be presented as if it passed (hard
              rule 2).
              """
              def load(raw, default):
                  try:
                      return json.loads(raw or "")
                  except Exception:
                      return default

              plan = load(plan_json, [])
              report = load(report_body, {})
              program = load(program_body, {})

              per_term = report.get("per_term") or {}
              result = {
                  "ok": bool(report.get("ok")),
                  "plan": plan,
                  "rationale": rationale or "",
                  "program": {
                      "code": program.get("code"),
                      "title": program.get("title"),
                      "tier": program.get("tier"),
                      "verified_on": program.get("verified_on"),
                      "source_url": program.get("source_url"),
                      "cohort": program.get("cohort"),
                  },
                  "validation": {
                      "ok": bool(report.get("ok")),
                      "error_count": report.get("error_count"),
                      "warning_count": report.get("warning_count"),
                      "errors": report.get("errors") or [],
                      "warnings": report.get("warnings") or [],
                      "credits": report.get("credits") or {},
                      "per_term": per_term,
                  },
                  "caveat": "Course data is extracted from official HKUST PDFs. "
                            "Check this plan with your academic advisor before "
                            "you register.",
              }
              return {"result": json.dumps(result, ensure_ascii=False, indent=1)}
        code_language: python3
        desc: Assembles the one output — the plan, the validator's own verdict, and
          the provenance of the data it was built from.
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: Assemble the answer
        type: code
