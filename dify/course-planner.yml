        body:
          data:
          - id: body-1710
            key: ''
            type: text
            value: '{"tool_token": "{{#1701.tool_token#}}", "profile": {{#1713.profile_json#}}, "plan": {{#1709.plan_json#}}}'
          type: json
        desc: The check that decides what comes out. Nothing downstream can overrule it.
        headers: Authorization:Bearer {{#1701.tool_token#}}
        method: post
        params: ''
        selected: false
        timeout:
          max_connect_timeout: 30
          max_read_timeout: 60
          max_write_timeout: 30
        title: Tool · validate_plan (final)
        type: http-request
        url: '{{#1701.tool_base#}}/tools/validate_plan'
        variables: []
      height: 150
      id: '1710'
      position:
        x: 3120
        y: 282
      positionAbsolute:
        x: 3120
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: "import json\nimport re\n\n\ndef main(plan_json: str, rationale: str, report_body: str,\n         program_body: str) -> dict:\n    \"\"\"One JSON document and one readable report, from the same facts.\n\n    The validator's report travels with the plan. A caller that reads\n    `ok` is reading the validator, not the model's opinion of itself,\n    and the Markdown lists every blocking error *above* the plan rather\n    than below it, so a plan that failed cannot be skimmed as though it\n    had passed (hard rule 2).\n    \"\"\"\n    def load(raw, default):\n        try:\n            return json.loads(raw or \"\")\n        except Exception:\n            return default\n\n    plan = load(plan_json, [])\n    report = load(report_body, {})\n    program = load(program_body, {})\n\n    per_term = report.get(\"per_term\") or {}\n    credits = report.get(\"credits\") or {}\n    errors = report.get(\"errors\") or []\n    warnings = report.get(\"warnings\") or []\n    ok = bool(report.get(\"ok\"))\n    caveat = (\"Course data is extracted from official HKUST PDFs. Check \"\n              \"this plan with your academic advisor before you register.\")\n\n    result = {\n        \"ok\": ok,\n        \"plan\": plan,\n        \"rationale\": rationale or \"\",\n        \"program\": {\n            \"code\": program.get(\"code\"),\n            \"title\": program.get(\"title\"),\n            \"tier\": program.get(\"tier\"),\n            \"verified_on\": program.get(\"verified_on\"),\n            \"source_url\": program.get(\"source_url\"),\n            \"cohort\": program.get(\"cohort\"),\n        },\n        \"validation\": {\n            \"ok\": ok,\n            \"error_count\": report.get(\"error_count\"),\n            \"warning_count\": report.get(\"warning_count\"),\n            \"errors\": errors,\n            \"warnings\": warnings,\n            \"credits\": credits,\n            \"per_term\": per_term,\n        },\n        \"caveat\": caveat,\n    }\n\n    # ----------------------------------------------- the same, for a person --\n    seasons = {\"Fall\": 0, \"Winter\": 1, \"Spring\": 2, \"Summer\": 3}\n\n    def order(term):\n        \"\"\"Transfer first, then by year, then Fall before Spring.\"\"\"\n        if term == \"Transfer\":\n            return (0, 0, 0)\n        found = re.match(r\"Y([0-9]+)[ ]+([A-Za-z]+)\", str(term or \"\"))\n        if not found:\n            return (9, 9, 9)\n        return (1, int(found.group(1)), seasons.get(found.group(2), 9))\n\n    def readable(code):\n        \"\"\"A slot is a choice, not a course, so the table says so.\"\"\"\n        text = str(code)\n        if not text.upper().startswith(\"SLOT:\"):\n            return text\n        size = re.search(r\"-([0-9]+(?:[.][0-9]+)?)CR$\", text, re.I)\n        if size:\n            return \"Free elective (\" + size.group(1) + \" cr)\"\n        return \"Free elective (you choose)\"\n\n    by_term = {}\n    for row in plan:\n        if isinstance(row, dict) and row.get(\"term\"):\n            by_term.setdefault(row[\"term\"], []).append(\n                readable(row.get(\"code\", \"\")))\n\n    lines = [\"# \" + str(program.get(\"title\") or \"Degree plan\"), \"\"]\n    checked = program.get(\"verified_on\")\n    badge = \"**\" + str(program.get(\"tier\") or \"unknown\") + \"**\"\n    if checked:\n        badge += \" · checked \" + str(checked)\n    lines.append(\"`\" + str(program.get(\"code\")) + \"` · cohort \"\n                 + str(program.get(\"cohort\")) + \" · data tier \" + badge)\n    lines.append(\"\")\n\n    if ok:\n        lines.append(\"**Passed every check.** \" + str(len(warnings))\n                     + \" things to verify yourself, listed below.\")\n        lines.append(\"\")\n    else:\n        lines.append(\"**This plan breaks \" + str(len(errors))\n                     + \" rule(s).** It is shown anyway, with every failure \"\n                     + \"named, because hiding it would be worse than \"\n                     + \"reading it.\")\n        lines.append(\"\")\n        lines.append(\"## Blocking errors\")\n \
          \       lines.append(\"\")\n        for issue in errors:\n            where = issue.get(\"term\") or issue.get(\"course\") or \"\"\n            prefix = \"**\" + str(where) + \"** — \" if where else \"\"\n            lines.append(\"- \" + prefix + str(issue.get(\"message\", \"\")))\n        lines.append(\"\")\n\n    lines.append(\"## The plan\")\n    lines.append(\"\")\n    lines.append(\"| Term | Credits | Courses |\")\n    lines.append(\"|---|---|---|\")\n    for term in sorted(by_term, key=order):\n        # Several free-elective slots in one term read identically, so they\n        # are counted rather than deduplicated: a term showing 18 credits\n        # beside two entries looks like an arithmetic error.\n        counted = {}\n        for label in by_term[term]:\n            counted[label] = counted.get(label, 0) + 1\n        shown = \", \".join(\n            label + (\" × \" + str(n) if n > 1 else \"\")\n            for label, n in sorted(counted.items()))\n        lines.append(\"| \" + str(term) + \" | \"\n                     + (\"%g\" % per_term.get(term, 0)) + \" | \" + shown + \" |\")\n    total = credits.get(\"confirmed\")\n    lines.append(\"| **Total** | **\"\n                 + ((\"%g\" % total) if total is not None else \"?\")\n                 + \"** | 120 needed to graduate |\")\n    lines.append(\"\")\n\n    if rationale:\n        lines.append(\"## What was changed, and why\")\n        lines.append(\"\")\n        lines.append(str(rationale))\n        lines.append(\"\")\n\n    if warnings:\n        lines.append(\"## Things to check (\" + str(len(warnings)) + \")\")\n        lines.append(\"\")\n        for issue in warnings:\n            lines.append(\"- \" + str(issue.get(\"message\", \"\")))\n        lines.append(\"\")\n\n    source = program.get(\"source_url\")\n    if source:\n        lines.append(\"Requirements read from <\" + str(source) + \">.\")\n        lines.append(\"\")\n    lines.append(\"*\" + caveat + \"*\")\n\n    return {\"result\": json.dumps(result, ensure_ascii=False, indent=1),\n            \"report\": chr(10).join(lines)}\n"
