    - data:
        code: |
          import json
          import re


          def main(llm_text: str, draft_body: str) -> dict:
              """Pull the plan out of the model's reply.

              The model is asked for bare JSON and usually gives it, but it may
              fence the block or write a sentence first. If nothing parses, fall
              back to the code-built draft rather than passing junk to the
              validator: a plan that was never shaped is still a legal plan.
              """
              text = llm_text or ""
              block = re.search(r"```(?:json)?\s*(.+?)```", text, re.S)
              candidates = [block.group(1)] if block else []
              brace = text.find("{")
              if brace != -1:
                  candidates.append(text[brace:])
              candidates.append(text)

              for candidate in candidates:
                  try:
                      parsed = json.loads(candidate.strip())
                  except Exception:
                      continue
                  if isinstance(parsed, dict) and isinstance(parsed.get("plan"), list):
                      rows = [r for r in parsed["plan"] if isinstance(r, dict)]
                      if rows:
                          return {
                              "plan_json": json.dumps(rows, ensure_ascii=False),
                              "rationale": str(parsed.get("rationale", "")),
                              "source": "model",
                          }

              try:
                  draft = json.loads(draft_body or "{}").get("plan") or []
              except Exception:
                  draft = []
              return {
                  "plan_json": json.dumps(draft, ensure_ascii=False),
                  "rationale": "The model's reply could not be read as a plan, so "
                               "the plan built by code was kept unchanged.",
                  "source": "draft",
              }
        code_language: python3
        desc: Reads the plan out of the reply. Falls back to the code-built draft
          rather than sending junk to the validator.
        outputs:
          plan_json:
            children: null
            type: string
          rationale:
            children: null
            type: string
          source:
            children: null
            type: string
        selected: false
        title: Read the plan
        type: code
        variables:
        - value_selector:
          - '1704'
          - text
          variable: llm_text
        - value_selector:
          - '1703'
          - body
          variable: draft_body
