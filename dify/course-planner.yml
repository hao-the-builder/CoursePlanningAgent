    - data:
        code: "import json\nimport re\n\n\ndef main(llm_text: str, draft_body: str) -> dict:\n    \"\"\"The same reader as before. Here `draft_body` is the plan that\n    went into the repair pass, so an unreadable repair leaves the\n    validated-once plan standing rather than losing it.\"\"\"\n    text = llm_text or \"\"\n    block = re.search(r\"```(?:json)?\\s*(.+?)```\", text, re.S)\n    candidates = [block.group(1)] if block else []\n    brace = text.find(\"{\")\n    if brace != -1:\n        candidates.append(text[brace:])\n    candidates.append(text)\n\n    for candidate in candidates:\n        try:\n            parsed = json.loads(candidate.strip())\n        except Exception:\n            continue\n        if isinstance(parsed, dict) and isinstance(parsed.get(\"plan\"), list):\n            rows = [r for r in parsed[\"plan\"] if isinstance(r, dict)]\n            if rows:\n                return {\n                    \"plan_json\": json.dumps(rows, ensure_ascii=False),\n                    \"rationale\": str(parsed.get(\"rationale\", \"\")),\n                    \"source\": \"model\",\n                }\n\n    return {\n        \"plan_json\": draft_body or \"[]\",\n        \"rationale\": \"The repair pass could not be read, so the plan \"\n                     \"from the first pass was kept.\",\n        \"source\": \"previous\",\n    }\n"
        code_language: python3
        desc: Reads the repaired plan, keeping the first-pass plan if the reply cannot be read.
        outputs:
