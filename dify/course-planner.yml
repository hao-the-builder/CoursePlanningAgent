        - id: sys-1708
          role: system
          text: 'You fix an HKUST degree plan that a validator has just checked.


            If the verdict is "clean", return the plan exactly as given, with a rationale saying it passed. Change nothing.


            If there are errors, fix those errors and only those. The same rules still hold: every course code must already appear in the plan you are given, rows marked taken, current or transfer stay where they are, slot rows stay slots, and credits are never edited.


            Answer with one JSON object and nothing else:


            {"plan": [{"code": "...", "term": "...", "status": "..."}, ...], "rationale": "what you fixed, or that nothing needed fixing"}'
        - id: usr-1708
          role: user
          text: 'Verdict: {{#1707.verdict#}}


