    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Shapes the draft to what the student asked for. It may move and swap
          rows; it may not invent one.
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: claude-opus-5-5
          provider: anthropic
        prompt_template:
        - id: sys-1704
          role: system
          text: 'You plan HKUST undergraduate degrees. You are one step inside a
            workflow that has already done the factual work for you, and your output
            is checked by a validator before anyone sees it.


            Rules you cannot break:


            1. Every course code you write must already appear in the draft plan
            you are given. You have no reliable memory of HKUST''s catalog, and a
            code you did not read from the draft is an invention. The validator
            will catch it and the plan will be thrown away.

            2. Keep every row whose status is taken, current or transfer exactly
            where it is. Those are facts about the student''s past.

            3. A row whose code begins with "SLOT" or "CC —" is a choice the student
            has not made yet. Leave it as a slot. Do not fill it with a real course.

            4. You may move a row to a different term, and you may drop or re-add a
            row the requirements allow. You may not change a row''s credits.

            5. Respect what the student asked for: the workload range, the spread,
            any term they want kept free, and any exchange term.


            Answer with one JSON object and nothing else:


            {"plan": [{"code": "...", "term": "...", "status": "..."}, ...],
            "rationale": "two or three sentences on what you changed and why"}


            Every row of the plan, every term, in that one array.'
        - id: usr-1704
          role: user
          text: 'The student''s profile:


            {{#1701.profile_json#}}


            The program, its requirement rules and its data tier:


            {{#1702.body#}}


            The draft plan built by code — the only source of real course codes
            here:


            {{#1703.body#}}


            Shape this draft to the profile and return the JSON object.'
        selected: false
        title: LLM · shape the plan
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1704'
